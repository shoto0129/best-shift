<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>best-shift (委員会機能追加版)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 10px; }
    h1, h2 { color: #333; }
    .card { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="date"], input[type="month"], select { width: 100%; padding: 8px; box-sizing: border-box; }
    .checkbox-group { display: flex; gap: 15px; margin-top: 5px; }
    button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    .btn-generate { background-color: #28a745; font-size: 16px; padding: 12px 20px; }
    .btn-generate:hover { background-color: #218838; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { border: 1px solid #ccc; padding: 4px; text-align: center; min-width: 30px; }
    th { background-color: #f2f2f2; }
    .table-container { overflow-x: auto; margin-top: 15px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    @media (max-width: 800px) { .grid-container { grid-template-columns: 1fr; } }
    
    .shift-休 { background-color: #ffe6e6; color: #d9534f; font-weight: bold; }
    .shift-夜 { background-color: #1d2124; color: #ffffff; font-weight: bold; }
    .shift-明 { background-color: #e2e3e5; color: #383d41; font-weight: bold; }
    .shift-早A { background-color: #fff3cd; color: #856404; font-weight: bold; }
    .shift-早B { background-color: #ffe8a1; color: #856404; font-weight: bold; }
    .shift-日A { background-color: #d4edda; color: #155724; font-weight: bold; }
    .shift-遅 { background-color: #e6f2ff; color: #0275d8; font-weight: bold; }
    .shift-未 { background-color: #ffcccc; color: #000; }
    
    .sunday { background-color: #fce8e6; }
    .saturday { background-color: #e6f2ff; }
    .grey-day { border-bottom: 4px solid gray; }
    .black-day { border-bottom: 4px solid black; }
  </style>
</head>
<body>

  <h1>best-shift</h1>

  <div class="grid-container">
    <!-- スタッフ登録 -->
    <section class="card">
      <h2>1. スタッフ追加</h2>
      <form id="staff-form">
        <div class="form-group">
          <label for="name">名前:</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>属性:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" id="is_leader"> リーダー</label>
            <label><input type="checkbox" id="is_trainee"> 実習生</label>
            <label><input type="checkbox" id="no_night_shift"> 夜勤不可</label>
          </div>
        </div>
        <div class="form-group">
          <label for="committee">担当委員会:</label>
          <select id="committee">
            <option value="">なし</option>
            <option value="事故防止委員会">事故防止委員会</option>
            <option value="ユニットリーダー会議">ユニットリーダー会議</option>
            <option value="サービス担当者会議">サービス担当者会議</option>
            <option value="感染委員会">感染委員会</option>
            <option value="行事委員会">行事委員会</option>
            <option value="運営会議">運営会議</option>
          </select>
        </div>
        <button type="submit">保存</button>
      </form>
    </section>

    <!-- 希望休登録 -->
    <section class="card">
      <h2>2. 希望休の登録</h2>
      <form id="holiday-form">
        <div class="form-group">
          <label for="holiday-staff">スタッフ:</label>
          <select id="holiday-staff" required><option value="">選択</option></select>
        </div>
        <div class="form-group">
          <label for="holiday-date">希望日:</label>
          <input type="date" id="holiday-date" required>
        </div>
        <button type="submit">保存</button>
      </form>
    </section>

    <!-- 委員会日程登録 -->
    <section class="card">
      <h2>3. 委員会の予定登録</h2>
      <form id="committee-form">
        <div class="form-group">
          <label for="committee-name">委員会名:</label>
          <select id="committee-name" required>
            <option value="">選択してください</option>
            <option value="事故防止委員会">事故防止委員会</option>
            <option value="ユニットリーダー会議">ユニットリーダー会議</option>
            <option value="サービス担当者会議">サービス担当者会議</option>
            <option value="感染委員会">感染委員会</option>
            <option value="行事委員会">行事委員会</option>
            <option value="運営会議">運営会議</option>
          </select>
        </div>
        <div class="form-group">
          <label for="committee-date">開催日:</label>
          <input type="date" id="committee-date" required>
        </div>
        <button type="submit">保存</button>
      </form>
    </section>
  </div>

  <section class="card" style="border: 2px solid #28a745;">
    <h2>シフト自動生成 (16日〜翌15日)</h2>
    <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 200px;">
        <label for="shift-month">対象月 (例: 8月を選ぶと 8/16〜9/15):</label>
        <input type="month" id="shift-month" required>
      </div>
      <button type="button" class="btn-generate" id="btn-generate-shift">シフト作成を実行</button>
    </div>
    <div class="table-container" id="shift-table-container"></div>
  </section>

  <!-- 登録データ一覧 -->
  <section class="grid-container">
    <div>
      <h2>スタッフ</h2>
      <table>
        <thead><tr><th>名前</th><th>属性</th><th>委員会</th></tr></thead>
        <tbody id="staff-list"></tbody>
      </table>
    </div>
    <div>
      <h2>希望休</h2>
      <table>
        <thead><tr><th>名前</th><th>希望日</th></tr></thead>
        <tbody id="holiday-list"></tbody>
      </table>
    </div>
    <div>
      <h2>委員会の予定</h2>
      <table>
        <thead><tr><th>委員会名</th><th>開催日</th></tr></thead>
        <tbody id="committee-list"></tbody>
      </table>
    </div>
  </section>

  <script>
    const SUPABASE_URL = 'https://swgbunughwwdigcgbiwx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3Z2J1bnVnaHd3ZGlnY2diaXd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTcxNDMsImV4cCI6MjEwMDczMzE0M30.Qaph8HNXEMhk4vqXAXiwpYClRI2L9qu9vRV6K-nJ9qA';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentStaffList = [];
    let currentHolidayList = [];
    let currentCommitteeDays = [];

    const today = new Date();
    document.getElementById('shift-month').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

    async function loadData() {
      const { data: staffData } = await supabaseClient.from('staff').select('*').order('id');
      const { data: holidayData } = await supabaseClient.from('requested_holidays').select('*, staff(name)');
      const { data: committeeData } = await supabaseClient.from('committee_days').select('*').order('committee_date');
      
      currentStaffList = staffData || [];
      currentHolidayList = holidayData || [];
      currentCommitteeDays = committeeData || [];

      document.getElementById('staff-list').innerHTML = currentStaffList.map(p => 
        `<tr><td>${p.name}</td><td>${p.is_leader?'L':''}${p.is_trainee?'実':''}</td><td>${p.committee||'-'}</td></tr>`
      ).join('');
      
      document.getElementById('holiday-staff').innerHTML = '<option value="">選択</option>' + currentStaffList.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      
      document.getElementById('holiday-list').innerHTML = currentHolidayList.map(h => 
        `<tr><td>${h.staff ? h.staff.name : ''}</td><td>${h.holiday_date}</td></tr>`
      ).join('');

      document.getElementById('committee-list').innerHTML = currentCommitteeDays.map(c => 
        `<tr><td>${c.committee_name}</td><td>${c.committee_date}</td></tr>`
      ).join('');
    }

    // --- メインのシフト生成ロジック ---
    document.getElementById('btn-generate-shift').addEventListener('click', () => {
      const selectedMonth = document.getElementById('shift-month').value;
      if (!selectedMonth || currentStaffList.length === 0) return alert('対象月を選択し、スタッフを登録してください');

      const [year, month] = selectedMonth.split('-').map(Number);
      
      const startDate = new Date(year, month - 1, 16);
      const dates = [];
      for (let i = 0; i < 31; i++) {
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);
        if (i > 0 && d.getDate() === 16) break; 
        dates.push(d);
      }

      const holidayMap = {};
      currentHolidayList.forEach(h => holidayMap[`${h.staff_id}_${h.holiday_date}`] = true);

      // 委員会の予定をマップ化 { '2026-08-20': '事故防止委員会' }
      const committeeMap = {};
      currentCommitteeDays.forEach(c => committeeMap[c.committee_date] = c.committee_name);

      const schedule = {};
      const nightCount = {};
      currentStaffList.forEach(s => {
        schedule[s.id] = {};
        nightCount[s.id] = 0;
      });

      const getConsecutiveDays = (staffId, dateIndex) => {
        let count = 0;
        for (let i = dateIndex - 1; i >= 0; i--) {
          const shift = schedule[staffId][i];
          if (!shift || shift === '休') break;
          count++;
        }
        return count;
      };

      // STEP 1: 希望休をセット
      dates.forEach((d, idx) => {
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        currentStaffList.forEach(s => {
          if (holidayMap[`${s.id}_${dateStr}`]) schedule[s.id][idx] = '休';
        });
      });

      // STEP 2: 夜勤セット
      dates.forEach((d, idx) => {
        const isGrey = (idx % 4 === 0); 
        const isBlack = (idx % 4 === 1);

        let candidates = currentStaffList.filter(s => {
          if (!s.can_night_shift) return false;
          if (nightCount[s.id] >= 6) return false; 
          if (schedule[s.id][idx] === '休') return false; 
          if (idx + 1 < dates.length && schedule[s.id][idx + 1]) return false;
          if (s.is_trainee && !isGrey) return false;
          if (getConsecutiveDays(s.id, idx) + 2 > 5) return false;
          return true;
        });

        if (candidates.length > 0) {
          let selected = null;
          if (isBlack) {
            const leader = candidates.find(c => c.is_leader);
            selected = leader || candidates.find(c => !c.is_trainee);
          } else if (isGrey) {
            selected = candidates.find(c => c.is_trainee) || candidates[0];
          } else {
            candidates = candidates.filter(c => !c.is_trainee);
            candidates.sort((a, b) => nightCount[a.id] - nightCount[b.id]);
            selected = candidates[0];
          }

          if (selected) {
            schedule[selected.id][idx] = '夜';
            nightCount[selected.id]++;
            if (idx + 1 < dates.length) schedule[selected.id][idx + 1] = '明';
            if (idx + 2 < dates.length) schedule[selected.id][idx + 2] = '休'; 
          }
        }
      });

      // STEP 2.5: 委員会ルール (担当者を早Aにする)
      dates.forEach((d, idx) => {
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const todayCommittee = committeeMap[dateStr];

        if (todayCommittee) {
          // その委員会の担当者で、まだシフトが入っていない(休みや夜勤でない)人を探す
          let assignee = currentStaffList.find(s => s.committee === todayCommittee && !schedule[s.id][idx]);
          
          // もし担当者が休みなら、代わりにリーダーを探す
          if (!assignee) {
            assignee = currentStaffList.find(s => s.is_leader && !schedule[s.id][idx]);
          }

          if (assignee) {
            schedule[assignee.id][idx] = '早A';
          }
        }
      });

      // STEP 3: 残りの早A, 早B, 日A, 遅 を配置
      dates.forEach((d, idx) => {
        const isSun = d.getDay() === 0;
        let available = currentStaffList.filter(s => !schedule[s.id][idx]);

        // その日に既に「早A」が委員会ルールで割り当てられているかチェック
        const isHayaAAssigned = currentStaffList.some(s => schedule[s.id][idx] === '早A');

        let reqShifts = ['早A', '日A', '遅', '早B'];
        if (isSun && available.length < 4) {
            reqShifts = ['早A', '日A', '遅']; 
        }

        // 既に早Aがいる場合は、リストから早Aを削る（重複させない）
        if (isHayaAAssigned) {
            reqShifts = reqShifts.filter(shift => shift !== '早A');
        }

        reqShifts.forEach(shiftCode => {
          if (available.length === 0) return;
          available.sort((a, b) => getConsecutiveDays(a.id, idx) - getConsecutiveDays(b.id, idx));
          const selected = available.shift(); 
          schedule[selected.id][idx] = shiftCode;
        });

        // 余った人は休みにする
        available.forEach(s => {
          schedule[s.id][idx] = '休';
        });
      });

      // --- テーブル描画 ---
      let tableHTML = `<table><thead><tr><th style="min-width: 80px;">名前</th>`;
      dates.forEach((d, idx) => {
        const isGrey = (idx % 4 === 0);
        const isBlack = (idx % 4 === 1);
        const dayStr = ['日','月','火','水','木','金','土'][d.getDay()];
        let cls = d.getDay() === 0 ? 'sunday' : d.getDay() === 6 ? 'saturday' : '';
        let borderCls = isGrey ? 'grey-day' : isBlack ? 'black-day' : '';
        
        tableHTML += `<th class="${cls} ${borderCls}">${d.getDate()}<br><small>${dayStr}</small></th>`;
      });
      tableHTML += `</tr></thead><tbody>`;

      currentStaffList.forEach(staff => {
        tableHTML += `<tr><td style="font-weight: bold; text-align: left; font-size:11px;">
          ${staff.name} <br><span style="color:#666; font-size:9px;">夜:${nightCount[staff.id]}回</span>
        </td>`;

        dates.forEach((d, idx) => {
          const shiftCode = schedule[staff.id][idx] || '未';
          const isSun = d.getDay() === 0;
          const isSat = d.getDay() === 6;
          tableHTML += `<td class="shift-${shiftCode} ${isSun?'sunday':isSat?'saturday':''}">${shiftCode}</td>`;
        });
        tableHTML += `</tr>`;
      });
      tableHTML += `</tbody></table>`;

      document.getElementById('shift-table-container').innerHTML = tableHTML;
    });

    // フォーム送信処理群
    document.getElementById('staff-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        is_leader: document.getElementById('is_leader').checked,
        is_trainee: document.getElementById('is_trainee').checked,
        can_night_shift: !document.getElementById('no_night_shift').checked,
        committee: document.getElementById('committee').value || null
      };
      await supabaseClient.from('staff').insert([payload]);
      document.getElementById('staff-form').reset();
      loadData();
    });

    document.getElementById('holiday-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await supabaseClient.from('requested_holidays').insert([{
        staff_id: document.getElementById('holiday-staff').value,
        holiday_date: document.getElementById('holiday-date').value
      }]);
      document.getElementById('holiday-form').reset();
      loadData();
    });

    document.getElementById('committee-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await supabaseClient.from('committee_days').insert([{
        committee_name: document.getElementById('committee-name').value,
        committee_date: document.getElementById('committee-date').value
      }]);
      document.getElementById('committee-form').reset();
      loadData();
    });

    loadData();
  </script>
</body>
</html>
