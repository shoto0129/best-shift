<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>best-shift（完全ルール対応版）</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 10px; }
    h1, h2 { color: #333; }
    .card { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="date"], input[type="month"], select { width: 100%; padding: 8px; box-sizing: border-box; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
    button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    .btn-generate { background-color: #28a745; font-size: 16px; padding: 12px 20px; }
    .btn-generate:hover { background-color: #218838; }
    .btn-save { background-color: #ff9800; font-size: 16px; padding: 12px 20px; display: none; }
    .btn-save:hover { background-color: #e68a00; }
    .btn-delete { background-color: #dc3545; padding: 4px 8px; font-size: 11px; margin: 0; }
    .btn-delete:hover { background-color: #c82333; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { border: 1px solid #ccc; padding: 4px; text-align: center; min-width: 30px; }
    th { background-color: #f2f2f2; }
    .table-container { overflow-x: auto; margin-top: 15px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    @media (max-width: 800px) { .grid-container { grid-template-columns: 1fr; } }
    
    .sunday { background-color: #fce8e6; }
    .saturday { background-color: #e6f2ff; }
    .grey-day { border-bottom: 4px solid gray; }
    .black-day { border-bottom: 4px solid black; }

    .shift-休 { background-color: #ffe6e6 !important; color: #d9534f; font-weight: bold; }
    .shift-有 { background-color: #e0f7fa !important; color: #006064; font-weight: bold; }
    .shift-夜 { background-color: #1d2124 !important; color: #ffffff; font-weight: bold; }
    .shift-明 { background-color: #e2e3e5 !important; color: #383d41; font-weight: bold; }
    .shift-早A { background-color: #fff3cd !important; color: #856404; font-weight: bold; }
    .shift-早B { background-color: #ffe8a1 !important; color: #856404; font-weight: bold; }
    .shift-日勤 { background-color: #cce5ff !important; color: #004085; font-weight: bold; }
    .shift-日A { background-color: #d4edda !important; color: #155724; font-weight: bold; }
    .shift-遅 { background-color: #e6f2ff !important; color: #0275d8; font-weight: bold; }
    .shift-未 { background-color: #ffcccc !important; color: #000; }
  </style>
</head>
<body>

  <h1>best-shift</h1>

  <div class="grid-container">
    <section class="card">
      <h2>1. スタッフ追加</h2>
      <form id="staff-form">
        <div class="form-group"><label for="name">名前:</label><input type="text" id="name" required></div>
        <div class="form-group"><label>属性:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" id="is_leader"> リーダー</label>
            <label><input type="checkbox" id="is_trainee"> 技能実習生</label>
            <label><input type="checkbox" id="no_night_shift"> 夜勤不可</label>
          </div>
        </div>
        <div class="form-group"><label>担当委員会 (複数選択OK):</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="committee" value="事故防止委員会"> 事故防止</label>
            <label><input type="checkbox" name="committee" value="ユニットリーダー会議"> Uリーダー</label>
            <label><input type="checkbox" name="committee" value="サービス担当者会議"> サ担</label>
            <label><input type="checkbox" name="committee" value="感染委員会"> 感染</label>
            <label><input type="checkbox" name="committee" value="行事委員会"> 行事</label>
            <label><input type="checkbox" name="committee" value="運営会議"> 運営</label>
          </div>
        </div>
        <button type="submit">保存</button>
      </form>
    </section>

    <section class="card">
      <h2>2. 希望休の登録 (最大2日)</h2>
      <form id="holiday-form">
        <div class="form-group">
          <label for="holiday-staff">スタッフ:</label>
          <select id="holiday-staff" required><option value="">選択</option></select>
        </div>
        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label for="holiday-date-1">希望日1 (必須):</label>
            <input type="date" id="holiday-date-1" required>
          </div>
          <div style="flex: 1;">
            <label for="holiday-date-2">希望日2 (任意):</label>
            <input type="date" id="holiday-date-2">
          </div>
        </div>
        <button type="submit">保存</button>
      </form>
    </section>

    <section class="card">
      <h2>3. 委員会の予定登録</h2>
      <form id="committee-form">
        <div class="form-group"><label for="committee-name">委員会名:</label>
          <select id="committee-name" required>
            <option value="">選択</option><option value="事故防止委員会">事故防止</option><option value="ユニットリーダー会議">Uリーダー</option>
            <option value="サービス担当者会議">サ担</option><option value="感染委員会">感染</option><option value="行事委員会">行事</option><option value="運営会議">運営</option>
          </select>
        </div>
        <div class="form-group"><label for="committee-date">開催日:</label><input type="date" id="committee-date" required></div>
        <button type="submit">保存</button>
      </form>
    </section>
  </div>

  <div class="grid-container" style="margin-bottom: 20px;">
    <section class="card">
      <h2>4. 有給の登録</h2>
      <form id="paid-form">
        <div class="form-group">
          <label for="paid-staff">スタッフ:</label>
          <select id="paid-staff" required><option value="">選択</option></select>
        </div>
        <div class="form-group">
          <label for="paid-date">有給日:</label>
          <input type="date" id="paid-date" required>
        </div>
        <button type="submit" style="background-color: #17a2b8;">有給を保存</button>
      </form>
    </section>
  </div>

  <section class="card" style="border: 2px solid #28a745;">
    <h2>シフト自動生成 (16日〜翌15日)</h2>
    <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 220px;">
        <label for="shift-month">対象月: <span id="shift-period-label" style="color: #007bff; font-weight: normal;"></span></label>
        <input type="month" id="shift-month" required>
      </div>
      <button type="button" class="btn-generate" id="btn-generate-shift">シフト作成を実行</button>
      <button type="button" class="btn-save" id="btn-save-shift">✅ このシフトを確定して保存</button>
    </div>
    <div class="table-container" id="shift-table-container"></div>
  </section>

  <section class="card" style="border: 2px solid #007bff;">
    <h2>過去のシフトを閲覧・削除</h2>
    <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
      <div style="width: 200px;">
        <label>対象月:</label>
        <input type="month" id="past-shift-month">
      </div>
      <button type="button" id="btn-view-past">表示する</button>
      <button type="button" id="btn-delete-past" style="background-color: #dc3545;">この月の保存シフトを削除</button>
    </div>
    <div class="table-container" id="past-shift-table-container"></div>
  </section>

  <section class="grid-container">
    <div><h2>スタッフ一覧</h2><table><thead><tr><th>名前</th><th>属性</th><th>委員会</th><th>操作</th></tr></thead><tbody id="staff-list"></tbody></table></div>
    <div><h2>希望休一覧</h2><table><thead><tr><th>名前</th><th>希望日</th><th>操作</th></tr></thead><tbody id="holiday-list"></tbody></table></div>
    <div><h2>有給一覧</h2><table><thead><tr><th>名前</th><th>有給日</th><th>操作</th></tr></thead><tbody id="paid-list"></tbody></table></div>
  </section>
  <section class="grid-container" style="margin-top: 15px;">
    <div><h2>委員会の予定</h2><table><thead><tr><th>委員会名</th><th>開催日</th><th>操作</th></tr></thead><tbody id="committee-list"></tbody></table></div>
  </section>

  <script>
    const SUPABASE_URL = 'https://swgbunughwwdigcgbiwx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3Z2J1bnVnaHd3ZGlnY2diaXd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTcxNDMsImV4cCI6MjEwMDczMzE0M30.Qaph8HNXEMhk4vqXAXiwpYClRI2L9qu9vRV6K-nJ9qA';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentStaffList = [];
    let currentHolidayList = [];
    let currentPaidList = [];
    let currentCommitteeDays = [];
    let currentGeneratedSchedule = null;
    let currentGeneratedDates = null;
    let currentPastShiftsMap = {};

    const today = new Date();
    const defaultMonthStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
    document.getElementById('shift-month').value = defaultMonthStr;
    document.getElementById('past-shift-month').value = defaultMonthStr;

    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function getShiftRange(monthInputVal) {
      const [year, month] = monthInputVal.split('-').map(Number);
      const startDate = new Date(year, month - 1, 16);
      const endDate = new Date(year, month, 15);
      return { startDate, endDate };
    }

    function updateDateConstraints() {
      const monthVal = document.getElementById('shift-month').value;
      if (!monthVal) return;

      const { startDate, endDate } = getShiftRange(monthVal);
      const startStr = formatDate(startDate);
      const endStr = formatDate(endDate);

      ['holiday-date-1', 'holiday-date-2', 'committee-date', 'paid-date'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.min = startStr;
          el.max = endStr;
          if (!el.value || el.value < startStr || el.value > endStr) {
            el.value = startStr;
          }
        }
      });

      const labelText = `（${startDate.getMonth() + 1}/${startDate.getDate()} 〜 ${endDate.getMonth() + 1}/${endDate.getDate()}）`;
      document.getElementById('shift-period-label').textContent = labelText;
    }

    document.getElementById('shift-month').addEventListener('change', updateDateConstraints);

    async function loadData() {
      const { data: staffData } = await supabaseClient.from('staff').select('*').order('id', { ascending: false });
      const { data: holidayData } = await supabaseClient.from('requested_holidays').select('*, staff(name)').order('id', { ascending: false });
      const { data: paidData } = await supabaseClient.from('paid_holidays').select('*, staff(name)').order('id', { ascending: false });
      const { data: committeeData } = await supabaseClient.from('committee_days').select('*').order('committee_date', { ascending: false });
      
      currentStaffList = staffData || [];
      currentHolidayList = holidayData || [];
      currentPaidList = paidData || [];
      currentCommitteeDays = committeeData || [];

      document.getElementById('staff-list').innerHTML = currentStaffList.map(p => 
        `<tr><td>${p.name}</td><td>${p.is_leader?'L':''}${p.is_trainee?'実':''}${!p.can_night_shift?'(夜不可)':''}</td><td style="font-size:10px;">${p.committee||'-'}</td><td><button class="btn-delete" onclick="deleteStaff(${p.id})">削除</button></td></tr>`
      ).join('');
      
      const staffOpts = '<option value="">選択</option>' + currentStaffList.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      document.getElementById('holiday-staff').innerHTML = staffOpts;
      document.getElementById('paid-staff').innerHTML = staffOpts;

      document.getElementById('holiday-list').innerHTML = currentHolidayList.map(h => 
        `<tr><td>${h.staff ? h.staff.name : ''}</td><td>${h.holiday_date}</td><td><button class="btn-delete" onclick="deleteHoliday(${h.id})">削除</button></td></tr>`
      ).join('');

      document.getElementById('paid-list').innerHTML = currentPaidList.map(p => 
        `<tr><td>${p.staff ? p.staff.name : ''}</td><td>${p.holiday_date}</td><td><button class="btn-delete" onclick="deletePaid(${p.id})">削除</button></td></tr>`
      ).join('');

      document.getElementById('committee-list').innerHTML = currentCommitteeDays.map(c => 
        `<tr><td>${c.committee_name}</td><td>${c.committee_date}</td><td><button class="btn-delete" onclick="deleteCommittee(${c.id})">削除</button></td></tr>`
      ).join('');
    }

    document.getElementById('staff-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const is_leader = document.getElementById('is_leader').checked;
      const is_trainee = document.getElementById('is_trainee').checked;
      const can_night_shift = !document.getElementById('no_night_shift').checked;
      
      const committeeCheckboxes = document.querySelectorAll('input[name="committee"]:checked');
      const committees = Array.from(committeeCheckboxes).map(cb => cb.value).join(',');

      const { error } = await supabaseClient.from('staff').insert([{
        name, is_leader, is_trainee, can_night_shift, committee: committees
      }]);
      
      if (error) alert('保存エラー: ' + error.message);
      else {
        alert('スタッフを追加しました！');
        e.target.reset();
        loadData();
      }
    });

    document.getElementById('holiday-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const staffId = document.getElementById('holiday-staff').value;
      const date1 = document.getElementById('holiday-date-1').value;
      const date2 = document.getElementById('holiday-date-2').value;

      if (!staffId || !date1) return;

      const monthVal = document.getElementById('shift-month').value;
      const { startDate, endDate } = getShiftRange(monthVal || defaultMonthStr);
      const periodStart = formatDate(startDate);
      const periodEnd = formatDate(endDate);
      const inPeriod = (d) => d >= periodStart && d <= periodEnd;
      const existing = currentHolidayList.filter(h => h.staff_id == staffId && inPeriod(h.holiday_date)).length;
      const newCount = (inPeriod(date1) ? 1 : 0) + (date2 && inPeriod(date2) ? 1 : 0);
      if (existing + newCount > 2) return alert('希望休は1期間あたり最大2日までです');

      const inserts = [{ staff_id: staffId, holiday_date: date1 }];
      if (date2) inserts.push({ staff_id: staffId, holiday_date: date2 });

      const { error } = await supabaseClient.from('requested_holidays').insert(inserts);
      
      if (error) alert('保存エラー: ' + error.message);
      else {
        alert('希望休を保存しました！');
        document.getElementById('holiday-date-1').value = '';
        document.getElementById('holiday-date-2').value = '';
        updateDateConstraints();
        loadData();
      }
    });

    document.getElementById('paid-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const staffId = document.getElementById('paid-staff').value;
      const date = document.getElementById('paid-date').value;
      if (!staffId || !date) return;

      const { error } = await supabaseClient.from('paid_holidays').insert([{ staff_id: staffId, holiday_date: date }]);
      if (error) alert('保存エラー: ' + error.message);
      else {
        alert('有給を保存しました！');
        document.getElementById('paid-date').value = '';
        updateDateConstraints();
        loadData();
      }
    });

    document.getElementById('committee-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const cName = document.getElementById('committee-name').value;
      const cDate = document.getElementById('committee-date').value;
      if(!cName || !cDate) return;

      const { error } = await supabaseClient.from('committee_days').insert([{
        committee_name: cName, committee_date: cDate
      }]);
      
      if (error) alert('保存エラー: ' + error.message);
      else {
        alert('委員会の予定を保存しました！');
        e.target.reset();
        updateDateConstraints();
        loadData();
      }
    });

    const SHIFT_WEIGHT = { '早A': 10, '早B': 20, '日勤': 25, '日A': 30, '遅': 40, '夜': 50, '明': 50 };
    const DAY_SHIFTS = ['早A', '早B', '日勤', '日A', '遅'];
    const TARGET_OFF_DAYS = 9;
    const TARGET_NIGHT_MIN = 5;
    const TARGET_NIGHT_MAX = 6;

    // 16日起点で3日おき (16, 20, 24, 28...)
    function isGreyDay(date, periodStart) {
      const diffDays = Math.round((date - periodStart) / 86400000);
      return diffDays >= 0 && diffDays % 4 === 0;
    }

    // 17日起点で3日おき (17, 21, 25, 29...)
    function isBlackDay(date, periodStart) {
      const diffDays = Math.round((date - periodStart) / 86400000);
      return diffDays >= 0 && diffDays % 4 === 1;
    }

    function isWorkDay(code) {
      return code && code !== '休' && code !== '有';
    }

    async function fetchPastShifts(startDate) {
      const fromDate = new Date(startDate);
      fromDate.setDate(fromDate.getDate() - 90);
      const toDate = new Date(startDate);
      toDate.setDate(toDate.getDate() - 1);
      const { data } = await supabaseClient.from('saved_shifts').select('*')
        .gte('shift_date', formatDate(fromDate)).lte('shift_date', formatDate(toDate));
      const past = {};
      if (data) data.forEach(row => {
        if (!past[row.staff_id]) past[row.staff_id] = {};
        past[row.staff_id][row.shift_date] = row.shift_code;
      });
      return past;
    }

    document.getElementById('btn-generate-shift').addEventListener('click', async () => {
      const selectedMonth = document.getElementById('shift-month').value;
      if (!selectedMonth || currentStaffList.length === 0) return alert('対象月を選択し、スタッフを登録してください');
      if (currentStaffList.length < 7) return alert('スタッフが7人未満のため実行できません');
      document.getElementById('btn-save-shift').style.display = 'none';

      const { startDate } = getShiftRange(selectedMonth);
      const dates = [];
      for (let i = 0; i < 31; i++) {
        const d = new Date(startDate); d.setDate(startDate.getDate() + i);
        if (i > 0 && d.getDate() === 16) break; 
        dates.push(d);
      }

      const pastShifts = await fetchPastShifts(startDate);
      currentPastShiftsMap = pastShifts;
      const periodStart = dates[0];
      const periodStartStr = formatDate(periodStart);
      const periodEndStr = formatDate(dates[dates.length - 1]);
      
      const holidayMap = {};
      currentHolidayList
        .filter(h => h.holiday_date >= periodStartStr && h.holiday_date <= periodEndStr)
        .forEach(h => { holidayMap[`${h.staff_id}_${h.holiday_date}`] = true; });

      const paidMap = {};
      currentPaidList
        .filter(p => p.holiday_date >= periodStartStr && p.holiday_date <= periodEndStr)
        .forEach(p => { paidMap[`${p.staff_id}_${p.holiday_date}`] = true; });

      const committeeMap = {};
      currentCommitteeDays
        .filter(c => c.committee_date >= periodStartStr && c.committee_date <= periodEndStr)
        .forEach(c => { committeeMap[c.committee_date] = c.committee_name; });

      let bestScore = Infinity;
      let bestSchedule = null;

      for (let attempt = 0; attempt < 2500; attempt++) {
        let { schedule, score } = generateSingleSchedule(dates, currentStaffList, holidayMap, paidMap, committeeMap, pastShifts, periodStart);
        if (score < bestScore) {
          bestScore = score;
          bestSchedule = schedule;
          if (bestScore === 0) break;
        }
      }

      currentGeneratedSchedule = bestSchedule;
      currentGeneratedDates = dates;
      renderTable('shift-table-container', dates, bestSchedule, pastShifts, periodStart);
      document.getElementById('btn-save-shift').style.display = 'inline-block';
      alert(`シフトを生成しました。\nスコア: ${bestScore}（0に近いほど完璧）`);
    });

    function getConsecutiveWorkDaysIncludingPast(staffId, dayIndex, schedule, dates, pastShifts, periodStart) {
      let conseq = 0;
      for (let i = dayIndex - 1; i >= 0; i--) {
        const code = schedule[staffId][i];
        if (!isWorkDay(code)) return conseq;
        conseq++;
      }
      let d = new Date(periodStart);
      d.setDate(d.getDate() - 1);
      while (conseq < 15) {
        const pastCode = pastShifts[staffId]?.[formatDate(d)];
        if (!isWorkDay(pastCode) || pastCode === '未') break;
        conseq++;
        d.setDate(d.getDate() - 1);
      }
      return conseq;
    }

    function canAssignNightBlock(staff, idx, schedule, dates, periodStart, pastShifts) {
      if (!staff.can_night_shift) return false;
      const date = dates[idx];

      // 特殊日ルール
      const grey = isGreyDay(date, periodStart);
      const black = isBlackDay(date, periodStart);

      if (staff.is_trainee && !grey) return false; // 実習生はグレーの日のみ夜勤可能
      if (black && !staff.is_leader) {
        // 黒の日はリーダーしか夜勤無理（どうしようもない場合の例外処理はスコア側に委ねるが基本はリーダー）
      }

      const cur = schedule[staff.id][idx];
      if (cur === '休' || cur === '有') return false;
      if (cur !== null && cur !== '夜') return false;
      if (idx + 1 >= dates.length) return false;
      const next = schedule[staff.id][idx + 1];
      if (next === '休' || next === '有') return false;
      if (next !== null && next !== '明') return false;
      if (idx + 2 < dates.length) {
        const after = schedule[staff.id][idx + 2];
        if (after !== null && after !== '休') return false;
      }

      // 連勤制限チェック (夜勤・明けを含めて最大5連勤)
      const priorWork = getConsecutiveWorkDaysIncludingPast(staff.id, idx, schedule, dates, pastShifts, periodStart);
      if (priorWork >= 4) return false; // 夜勤を入れると4日目になり、翌日明けて5連勤となるためOKだが、すでに4日以上働いていたらNG

      return true;
    }

    function assignNightBlock(staffId, idx, schedule, dates) {
      schedule[staffId][idx] = '夜';
      if (idx + 1 < dates.length) schedule[staffId][idx + 1] = '明';
      if (idx + 2 < dates.length) schedule[staffId][idx + 2] = '休';
    }

    function generateSingleSchedule(dates, staffs, holidayMap, paidMap, committeeMap, pastShifts, periodStart) {
      let schedule = {};
      staffs.forEach(s => schedule[s.id] = new Array(dates.length).fill(null));
      let score = 0;
      const shuffle = (arr) => arr.slice().sort(() => Math.random() - 0.5);

      // 1. 前月からの 夜→明→休 引継ぎ
      staffs.forEach(staff => {
        const d15 = new Date(periodStart); d15.setDate(d15.getDate() - 1);
        const d14 = new Date(periodStart); d14.setDate(d14.getDate() - 2);
        const s15 = pastShifts[staff.id]?.[formatDate(d15)];
        const s14 = pastShifts[staff.id]?.[formatDate(d14)];

        if (s15 === '夜') {
          schedule[staff.id][0] = '明';
          if (dates.length > 1) schedule[staff.id][1] = '休';
        } else if (s14 === '夜' && s15 === '明') {
          schedule[staff.id][0] = '休';
        }
      });

      // 2. 希望休・有給
      dates.forEach((d, idx) => {
        const dateStr = formatDate(d);
        staffs.forEach(s => {
          if (holidayMap[`${s.id}_${dateStr}`]) schedule[s.id][idx] = '休';
          if (paidMap[`${s.id}_${dateStr}`]) schedule[s.id][idx] = '有';
        });
      });

      // 3. 委員会 → 担当者は早A（希望休ならリーダーが代行）
      dates.forEach((d, idx) => {
        const dateStr = formatDate(d);
        const cName = committeeMap[dateStr];
        if (!cName) return;

        const members = staffs.filter(s => (s.committee || '').includes(cName));
        let assignee = members.find(s => schedule[s.id][idx] === null);

        if (!assignee) {
          // 担当者が希望休等の場合、リーダーが向かう
          const leaders = staffs.filter(s => s.is_leader && schedule[s.id][idx] === null);
          assignee = leaders.length > 0 ? shuffle(leaders)[0] : null;
        }

        if (assignee && schedule[assignee.id][idx] === null) {
          schedule[assignee.id][idx] = '早A';
        } else {
          score += 5000;
        }
      });

      // 4. 夜勤の配置
      dates.forEach((d, idx) => {
        if (staffs.some(s => schedule[s.id][idx] === '夜')) return;

        const black = isBlackDay(d, periodStart);
        let cands = staffs.filter(s => canAssignNightBlock(s, idx, schedule, dates, periodStart, pastShifts));

        if (black) {
          let leaderCands = cands.filter(s => s.is_leader);
          if (leaderCands.length > 0) {
            cands = leaderCands;
          } else {
            // リーダーが無理なら実習生以外の誰か
            cands = cands.filter(s => !s.is_trainee);
            score += 3000; // 黒の日にリーダー以外がやるペナルティ
          }
        }

        if (cands.length === 0) {
          score += 15000;
          return;
        }

        // 夜勤回数の偏りが少ない人を優先
        cands.sort((a, b) => {
          const nightA = schedule[a.id].filter(x => x === '夜').length;
          const nightB = schedule[b.id].filter(x => x === '夜').length;
          return nightA - nightB;
        });

        const chosen = cands[0];
        assignNightBlock(chosen.id, idx, schedule, dates);
      });

      // 5. 夜勤しない人は3連勤まで（がんばっても4連勤まで）
      staffs.filter(s => !s.can_night_shift).forEach(s => {
        for (let i = 0; i < dates.length; i++) {
          if (schedule[s.id][i] !== null) continue;
          const conseq = getConsecutiveWorkDaysIncludingPast(s.id, i, schedule, dates, pastShifts, periodStart);
          if (conseq >= 3) schedule[s.id][i] = '休';
        }
      });

      // 6. 公休9回 ＆ 最低1回は連休（極力2連休）
      staffs.forEach(s => {
        let currentOffs = schedule[s.id].filter(x => x === '休').length;
        let neededOffs = TARGET_OFF_DAYS - currentOffs;

        let hasDouble = false;
        for (let i = 0; i < dates.length - 1; i++) {
          if (schedule[s.id][i] === '休' && schedule[s.id][i + 1] === '休') { hasDouble = true; break; }
        }

        if (!hasDouble && neededOffs >= 2) {
          const emptyPairs = [];
          for (let i = 0; i < dates.length - 1; i++) {
            if (schedule[s.id][i] === null && schedule[s.id][i + 1] === null) emptyPairs.push(i);
          }
          if (emptyPairs.length > 0) {
            const p = shuffle(emptyPairs)[0];
            schedule[s.id][p] = '休';
            schedule[s.id][p + 1] = '休';
            neededOffs -= 2;
          }
        }

        const emptyDays = [];
        for (let i = 0; i < dates.length; i++) {
          if (schedule[s.id][i] === null) emptyDays.push(i);
        }
        shuffle(emptyDays).slice(0, neededOffs).forEach(i => { schedule[s.id][i] = '休'; });
      });

      // 7. 日勤帯を埋める（左の日にちから、出勤時間が早い順に入れる）
      dates.forEach((d, idx) => {
        // 日曜日の早Bをなくす対応（人がどうしても足りないとき）
        let expectedShifts = DAY_SHIFTS.slice();
        const availableCount = staffs.filter(s => schedule[s.id][idx] === null).length;
        if (d.getDay() === 0 && availableCount < 5) {
          expectedShifts = expectedShifts.filter(s => s !== '早B');
        }

        expectedShifts.forEach(shiftCode => {
          if (staffs.some(s => schedule[s.id][idx] === shiftCode)) return;

          let available = staffs.filter(s => schedule[s.id][idx] === null);
          if (available.length === 0) {
            score += 2000;
            return;
          }

          // 連勤超過やシフト負荷を考慮して選ぶ
          available.sort((a, b) => {
            const conseqA = getConsecutiveWorkDaysIncludingPast(a.id, idx, schedule, dates, pastShifts, periodStart);
            const conseqB = getConsecutiveWorkDaysIncludingPast(b.id, idx, schedule, dates, pastShifts, periodStart);
            return conseqA - conseqB;
          });

          const chosen = available[0];
          schedule[chosen.id][idx] = shiftCode;
        });
      });

      // 8. 休みの数の関係で出勤が被る場合はリーダーが日勤（日）
      dates.forEach((d, idx) => {
        if (d.getDay() === 0) {
          staffs.forEach(s => {
            if (s.is_leader && schedule[s.id][idx] === '早A') {
              schedule[s.id][idx] = '日勤';
            }
          });
        }
      });

      // 9. スコア評価
      dates.forEach((d, idx) => {
        const nightCount = staffs.filter(s => schedule[s.id][idx] === '夜').length;
        if (nightCount !== 1) score += 20000;
      });

      staffs.forEach(s => {
        const offCount = schedule[s.id].filter(x => x === '休').length;
        if (offCount !== TARGET_OFF_DAYS) score += Math.abs(offCount - TARGET_OFF_DAYS) * 2000;
        
        const nullCount = schedule[s.id].filter(x => x === null).length;
        score += nullCount * 50000;
      });

      return { schedule, score };
    }

    document.getElementById('btn-save-shift').addEventListener('click', async () => {
      if (!currentGeneratedSchedule) return;
      if (!confirm('このシフトをデータベースに保存しますか？')) return;
      
      const insertData = [];
      currentStaffList.forEach(staff => {
        currentGeneratedDates.forEach((d, idx) => {
          insertData.push({ staff_id: staff.id, shift_date: formatDate(d), shift_code: currentGeneratedSchedule[staff.id][idx] || '未' });
        });
      });
      
      const { error } = await supabaseClient.from('saved_shifts').upsert(insertData, { onConflict: 'staff_id, shift_date' });
      if (error) alert('保存失敗: ' + error.message);
      else {
        alert('保存完了！');
        document.getElementById('btn-save-shift').style.display = 'none';
      }
    });

    document.getElementById('btn-view-past').addEventListener('click', async () => {
      const selectedMonth = document.getElementById('past-shift-month').value;
      if (!selectedMonth) return;
      const { startDate } = getShiftRange(selectedMonth);
      const dates = [];
      for (let i = 0; i < 31; i++) {
        const d = new Date(startDate); d.setDate(startDate.getDate() + i);
        if (i > 0 && d.getDate() === 16) break; 
        dates.push(d);
      }
      
      const { data } = await supabaseClient.from('saved_shifts').select('*')
        .gte('shift_date', formatDate(dates[0])).lte('shift_date', formatDate(dates[dates.length-1]));
      
      if (!data || data.length === 0) return alert('この期間の保存されたシフトはありません。');

      const pastSchedule = {};
      currentStaffList.forEach(s => pastSchedule[s.id] = {});
      data.forEach(row => {
        if(pastSchedule[row.staff_id]) {
          const idx = dates.findIndex(d => formatDate(d) === row.shift_date);
          if (idx !== -1) pastSchedule[row.staff_id][idx] = row.shift_code;
        }
      });

      const pastShifts = await fetchPastShifts(startDate);
      renderTable('past-shift-table-container', dates, pastSchedule, pastShifts, dates[0]);
    });

    document.getElementById('btn-delete-past').addEventListener('click', async () => {
      const selectedMonth = document.getElementById('past-shift-month').value;
      if (!selectedMonth) return alert('対象月を選択してください');
      if (!confirm(`${selectedMonth} の保存されたシフトをすべて削除しますか？`)) return;

      const { startDate } = getShiftRange(selectedMonth);
      const dates = [];
      for (let i = 0; i < 31; i++) {
        const d = new Date(startDate); d.setDate(startDate.getDate() + i);
        if (i > 0 && d.getDate() === 16) break; 
        dates.push(d);
      }

      const { error } = await supabaseClient.from('saved_shifts').delete()
        .gte('shift_date', formatDate(dates[0]))
        .lte('shift_date', formatDate(dates[dates.length - 1]));

      if (error) alert('削除失敗: ' + error.message);
      else { alert('削除しました'); document.getElementById('past-shift-table-container').innerHTML = ''; }
    });

    function calculateMaxConsecutive(staffId, dates, schedule, pastShifts, periodStart) {
      let maxConseq = 0;
      let conseq = 0;

      let d = new Date(periodStart); d.setDate(d.getDate() - 1);
      let pastList = [];
      while(true) {
        let pastCode = pastShifts[staffId]?.[formatDate(d)];
        if (!isWorkDay(pastCode) || pastCode === '未') break;
        pastList.unshift(pastCode);
        d.setDate(d.getDate() - 1);
        if (pastList.length > 10) break;
      }
      conseq = pastList.length;
      if (conseq > maxConseq) maxConseq = conseq;

      for (let i = 0; i < dates.length; i++) {
        let code = schedule[staffId]?.[i] || '未';
        if (!isWorkDay(code) || code === '未') {
          conseq = 0;
        } else {
          conseq++;
          if (conseq > maxConseq) maxConseq = conseq;
        }
      }
      return maxConseq;
    }

    function renderTable(containerId, dates, schedule, pastShifts, periodStart) {
      let tableHTML = `<table><thead><tr><th style="min-width: 80px;">名前</th>`;
      dates.forEach((d) => {
        const grey = isGreyDay(d, periodStart);
        const black = isBlackDay(d, periodStart);
        const dayStr = ['日','月','火','水','木','金','土'][d.getDay()];
        let cls = d.getDay() === 0 ? 'sunday' : d.getDay() === 6 ? 'saturday' : '';
        let borderCls = grey ? 'grey-day' : black ? 'black-day' : '';
        tableHTML += `<th class="${cls} ${borderCls}">${d.getDate()}<br><small>${dayStr}</small></th>`;
      });
      tableHTML += `<th style="min-width: 150px;">シフト集計</th></tr></thead><tbody>`;

      currentStaffList.forEach(staff => {
        tableHTML += `<tr><td style="font-weight: bold; text-align: left; font-size:12px;">${staff.name}</td>`;
        const counts = { '早A': 0, '早B': 0, '日A': 0, '日勤': 0, '遅': 0, '夜': 0, '明': 0, '休': 0, '有': 0 };
        dates.forEach((d) => {
          const shiftCode = schedule[staff.id][dates.indexOf(d)] || '未';
          if (counts[shiftCode] !== undefined) counts[shiftCode]++; 
          const isSun = d.getDay() === 0; const isSat = d.getDay() === 6;
          tableHTML += `<td class="shift-${shiftCode} ${isSun?'sunday':isSat?'saturday':''}">${shiftCode}</td>`;
        });

        const maxConseq = calculateMaxConsecutive(staff.id, dates, schedule, pastShifts || currentPastShiftsMap, periodStart);
        const limit = staff.can_night_shift ? 5 : 4;
        const conseqColor = maxConseq > limit ? 'color: red; font-weight: bold;' : '';
        const nightCount = counts['夜'];
        const nightColor = (nightCount < TARGET_NIGHT_MIN || nightCount > TARGET_NIGHT_MAX) && staff.can_night_shift
          ? 'color: orange; font-weight: bold;' : '';

        tableHTML += `<td style="font-size:11px; text-align:left; line-height:1.5;">
          早A:${counts['早A']} / 早B:${counts['早B']} / 日A:${counts['日A']} / 日勤:${counts['日勤']} / 遅:${counts['遅']}<br>
          <span style="${nightColor}">夜:${counts['夜']}</span> / 明:${counts['明']} / 休:${counts['休']} / 有:${counts['有']}<br>
          <span style="${conseqColor}">最大連勤: ${maxConseq} 日</span>
        </td></tr>`;
      });
      tableHTML += `</tbody></table>`;
      document.getElementById(containerId).innerHTML = tableHTML;
    }

    window.deleteStaff = async function(id) { if(!confirm('削除しますか？')) return; await supabaseClient.from('saved_shifts').delete().eq('staff_id', id); await supabaseClient.from('requested_holidays').delete().eq('staff_id', id); await supabaseClient.from('paid_holidays').delete().eq('staff_id', id); await supabaseClient.from('staff').delete().eq('id', id); loadData(); };
    window.deleteHoliday = async function(id) { if(!confirm('削除しますか？')) return; await supabaseClient.from('requested_holidays').delete().eq('id', id); loadData(); };
    window.deletePaid = async function(id) { if(!confirm('削除しますか？')) return; await supabaseClient.from('paid_holidays').delete().eq('id', id); loadData(); };
    window.deleteCommittee = async function(id) { if(!confirm('削除しますか？')) return; await supabaseClient.from('committee_days').delete().eq('id', id); loadData(); };

    updateDateConstraints();
    loadData();
  </script>
